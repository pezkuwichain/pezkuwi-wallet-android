[package]
authors = ['PezkuwiChain']
edition = '2021'
license = 'Apache-2.0'
name = "pezkuwi-light"
version = "0.1.0"
publish = false

[dependencies]
# PezkuwiChain fork of smoldot: upstream smoldot cannot verify PezkuwiChain blocks (sovereign
# sr25519 and BABE VRF signing contexts, `TeyrchainHost` runtime API).
smoldot-light = { git = "https://github.com/pezkuwichain/smoldot", rev = "182d996a3ae2a9b507a776fa307f2e6fc5d14f7a", default-features = false, features = ["std"] }
smoldot = { git = "https://github.com/pezkuwichain/smoldot", rev = "182d996a3ae2a9b507a776fa307f2e6fc5d14f7a", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
pin-project = "1"
async-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "futures-03-sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
smol = "2.0"
jni = { version = "0.21", default-features = false }
log = "0.4"
rand = "0.8"
hex = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.14", default-features = false }

[dev-dependencies]
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tungstenite = "0.24"

# Line tables only: enough for the Play native-debug-symbols.zip to give file and line, at 59 MB
# per ABI before the app strips it to 8.6 MB. Full debug info (`debug = 2`) is 147 MB per ABI.
[profile.release]
strip = false
debug = "line-tables-only"
lto = true
opt-level = "s"

[lib]
name = "pezkuwi_light"
crate-type = ["cdylib", "rlib"]
