// Every Android library the app ships is listed, with its licence, in the APK itself; a dependency
// under a licence not allowed here fails the build. The Rust crates and the prebuilt native
// libraries are listed beside it (assets/licences, scripts/licences/rust_notices.py).
licensee {
    allow('Apache-2.0')
    allow('MIT')
    allow('BSD-2-Clause')
    allow('BSD-3-Clause')
    allow('ISC')
    allow('CC0-1.0')
    allowUrl('https://www.zetetic.net/sqlcipher/license/') {
        because 'SQLCipher Community Edition, a BSD-style licence'
    }
    // Permissive licences their POMs name by a URL licensee does not map to an SPDX id.
    allowUrl('http://opensource.org/licenses/BSD-2-Clause') { because 'BSD-2-Clause' }
    allowUrl('https://spdx.org/licenses/MIT.txt') { because 'MIT' }
    allowUrl('http://www.bouncycastle.org/licence.html') { because 'Bouncy Castle licence, MIT-style' }
    allowUrl('https://www.bouncycastle.org/licence.html') { because 'Bouncy Castle licence, MIT-style' }
    allowUrl('https://asm.ow2.io/license.html') { because 'ASM licence, BSD-3-Clause' }
    allowUrl('https://github.com/facebook/shimmer-android/blob/master/LICENSE') { because 'BSD licence' }
    allowUrl('https://github.com/multiformats/java-multiaddr/blob/master/LICENSE') { because 'MIT' }
    allowUrl('https://github.com/journeyapps/zxing-android-embedded/blob/master/COPYING') { because 'Apache-2.0' }
    allowUrl('https://github.com/TooTallNate/Java-WebSocket/blob/master/LICENSE') { because 'MIT' }
    // Google's SDKs in the Play build, under Google's terms. The build without Google services (D22) drops them.
    allowUrl('https://developer.android.com/studio/terms.html') { because 'Google Play services and Firebase' }
    allowUrl('https://developer.android.com/guide/playcore/license') { because 'Google Play Core' }
    allowUrl('https://developer.android.com/google/play/integrity/overview#tos') { because 'Google Play Integrity' }
    // POMs that declare no licence or none licensee can read; the licence is the one in the project's repository.
    allowDependency('io.coil-kt', 'coil', '1.2.1') { because 'Apache-2.0, named without a URL' }
    allowDependency('io.coil-kt', 'coil-base', '1.2.1') { because 'Apache-2.0, named without a URL' }
    allowDependency('io.coil-kt', 'coil-svg', '1.2.1') { because 'Apache-2.0, named without a URL' }
    allowDependency('com.github.PhilJay', 'MPAndroidChart', 'v3.1.0') { because 'Apache-2.0' }
    allowDependency('com.github.florent37', 'RuntimePermission', '1.1.2') { because 'Apache-2.0' }
    allowDependency('com.github.komputing', 'khex', '1.1.2') { because 'MIT' }
    ['bip32', 'bip39', 'bip39_wordlist_en', 'crypto', 'crypto_api', 'crypto_impl_java_provider',
     'crypto_impl_spongycastle', 'extensions_kotlin', 'keccak_shortcut', 'model'].each { module ->
        allowDependency('com.github.komputing.kethereum', module, '0.85.7') { because 'MIT' }
    }
    // Eclipse Public Licence, taken one library at a time: a weak copyleft whose source obligation
    // covers changes to the library itself, which we do not make.
    allowDependency('junit', 'junit', '4.13.2') { because 'EPL-1.0' }
    allowDependency('org.eclipse.birt.runtime.3_7_1', 'org.apache.xerces', '2.9.0') { because 'EPL-1.0' }
    allowDependency('com.github.jnr', 'jnr-posix', '3.1.15') { because 'EPL-2.0, GPL-2.0 or LGPL-2.1: used under EPL-2.0' }
    allowDependency('jakarta.ws.rs', 'jakarta.ws.rs-api', '3.1.0') { because 'EPL-2.0 or GPL-2.0 with Classpath exception: used under EPL-2.0' }
    bundleAndroidAsset = true
    androidAssetReportPath = 'licences/android-libraries.json'
}

task printVersion {
    doLast {
        println "versionName:${computeVersionName()}"
    }
