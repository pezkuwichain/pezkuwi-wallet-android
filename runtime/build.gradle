apply from: '../scripts/secrets.gradle'
apply plugin: 'kotlin-parcelize'

def chainsUrl = "https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/chains/v22/android/chains.json"
def bundledConfigDir = "$buildDir/generated/bundledConfig"

android {

    defaultConfig {

        buildConfigField "String", "CHAINS_URL", "\"$chainsUrl\""
        buildConfigField "String", "EVM_ASSETS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/assets/evm/v3/assets.json\""
        buildConfigField "String", "PRE_CONFIGURED_CHAINS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/chains/v22/preConfigured/chains.json\""
        buildConfigField "String", "PRE_CONFIGURED_CHAIN_DETAILS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/chains/v22/preConfigured/details\""

        buildConfigField "String", "TEST_CHAINS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/tests/chains_for_testBalance.json\""
        buildConfigField "String", "TEST_ASSETS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/tests/pezkuwi_assets_for_testBalance.json\""

        buildConfigField "String", "INFURA_API_KEY", readStringSecret("INFURA_API_KEY")
        buildConfigField "String", "DWELLIR_API_KEY", readStringSecret("DWELLIR_API_KEY")
        buildConfigField "String", "TRONGRID_API_KEY", readStringSecret("TRONGRID_API_KEY")
    }

    buildTypes {
        debug {

        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            buildConfigField "String", "CHAINS_URL", "\"$chainsUrl\""
            buildConfigField "String", "EVM_ASSETS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/assets/evm/v3/assets.json\""
            buildConfigField "String", "PRE_CONFIGURED_CHAINS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/chains/v22/preConfigured/chains.json\""
            buildConfigField "String", "PRE_CONFIGURED_CHAIN_DETAILS_URL", "\"https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/chains/v22/preConfigured/details\""
        }
    }
    namespace 'io.novafoundation.nova.runtime'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(":common")
    implementation project(":core-db")

    implementation project(":core-api")

    implementation project(":bindings:metadata_shortener")
    implementation project(":bindings:sr25519-bizinikiwi")

    implementation gsonDep
    implementation substrateSdkDep

    implementation kotlinDep

    implementation coroutinesDep

    implementation retrofitDep

    implementation daggerDep
    ksp daggerCompiler

    testImplementation project(':test-shared')

    implementation lifeCycleKtxDep

    androidTestImplementation androidTestRunnerDep
    androidTestImplementation androidTestRulesDep
    androidTestImplementation androidJunitDep
}

// The chain list a first install starts from when none can be fetched (AssetBundledChains). It is the live
// list at build time, so every build carries the chains that were current when it was made.
def bundleChainsConfig = tasks.register("bundleChainsConfig") {
    def target = file("$bundledConfigDir/bundled-config/chains.json")
    outputs.file(target)
    outputs.upToDateWhen { false }

    doLast {
        def sources = [
            chainsUrl,
            chainsUrl.replace("https://raw.githubusercontent.com/pezkuwichain/pezkuwi-wallet-utils/master/",
                "https://cdn.jsdelivr.net/gh/pezkuwichain/pezkuwi-wallet-utils@master/")
        ]
        def bytes = null
        for (source in sources) {
            try {
                bytes = new URL(source).getBytes(connectTimeout: 20_000, readTimeout: 60_000)
                break
            } catch (IOException e) {
                logger.warn("bundleChainsConfig: $source failed: $e")
            }
        }
        if (bytes == null) throw new GradleException("bundleChainsConfig: no source answered")

        def chains = new groovy.json.JsonSlurper().parse(bytes)
        if (!(chains instanceof List) || chains.isEmpty()) {
            throw new GradleException("bundleChainsConfig: the chain list is not a non-empty JSON array")
        }

        target.parentFile.mkdirs()
        target.bytes = bytes
        def sha256 = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString()
        logger.lifecycle("bundleChainsConfig: ${chains.size()} chains, sha256 $sha256")
    }
}

android.sourceSets.main.assets.srcDir(bundledConfigDir)
preBuild.dependsOn(bundleChainsConfig)
